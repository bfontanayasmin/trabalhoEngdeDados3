<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Pipeline da loja: do Neon à camada Gold no Databricks</title>
<desc id="desc">O PostgreSQL no Neon é o banco externo. O Job prepara o ambiente e encadeia a extração para CSV na Landing, a conversão para Delta na Bronze, o tratamento e validação na Silver e a modelagem dimensional na Gold.</desc>
