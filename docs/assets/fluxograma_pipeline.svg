<text x="40" y="52" font-size="26" font-weight="700" fill="#143d43">Pipeline de dados da loja</text>
<text x="40" y="84" font-size="16" fill="#476271">Banco externo → arquivos CSV → tabelas Delta → modelo dimensional</text>
<rect x="275" y="126" width="690" height="480" rx="18" fill="#ffffff" stroke="#b9ced0" stroke-width="2"/>
<text x="302" y="162" font-size="20" font-weight="700" fill="#143d43">Databricks Free Edition</text>
<rect x="302" y="182" width="636" height="78" rx="12" fill="#e2f0ef"/>
